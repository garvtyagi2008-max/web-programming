<!DOCTYPE html>
<html>
<head>
    <title>Weekly Timetable</title>
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0" style="text-align: center;">
        <!-- Row 1: Main Title spanning all 4 columns -->
        <tr>
            <th colspan="4">Weekly Timetable</th>
        </tr>

        <!-- Row 2: Column Headers -->
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>

        <!-- Row 3: Monday Schedule (Web Lab spans 2 rows) -->
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web Lab</td>
        </tr>

        <!-- Row 4: Tuesday Schedule (4th cell is omitted due to rowspan above) -->
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>

        <!-- Row 5: Wednesday Schedule (Seminar spans 3 columns) -->
        <tr>
            <td>Wed</td>
            <td colspan="3">Seminar</td>
        </tr>
    </table>

</body>
</html>
