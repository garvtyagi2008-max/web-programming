<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Page</title>
</head>
<body>

    <!-- Skip Link -->
    <a href="#main-content">Skip to main content</a>

    <!-- Navigation with ARIA Label -->
    <nav aria-label="Primary Navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- Proper Heading -->
        <h1>Accessible Page</h1>

        <!-- Image with Alt Text -->
        <img src="image.jpg" alt="Sample descriptive image">

        <!-- Search Form with Label and ARIA Attribute -->
        <form role="search">
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" name="search" aria-label="Search site content">
        </form>
    </main>

</body>
</html>
